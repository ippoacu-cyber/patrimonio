<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://servicios.ine.es https://api.frankfurter.dev https://api.frankfurter.app https://graph.microsoft.com https://login.microsoftonline.com https://login.live.com https://*.1drv.com https://*.files.1drv.com https://*.microsoftpersonalcontent.com https://*.livefilestore.com https://onedrive.live.com https://*.sharepoint.com; frame-src https://login.microsoftonline.com https://login.live.com; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Mi patrimonio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0C11">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0C11; --surface:#141821; --surface-2:#1C2130; --ink:#EEF1F6; --muted:#8891A5; --line:#232938;
  --accent:#5B8CFF; --accent-soft:#18233F; --pos:#2FD08F; --neg:#FF6B6B; --warn:#F5B841;
  --inv:#5B8CFF; --ei:#A78BFA; --ef:#5E6B80;
  --inv-on:#FFFFFF; --ei-on:#C9B8FF; --ef-on:rgba(255,255,255,.45);
  --hero:radial-gradient(120% 140% at 0% 0%,#26357A 0%,#1A1F4A 45%,#141821 100%);
  --edge:rgba(255,255,255,.06);
  --r:20px; --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)}
[hidden]{display:none!important}

/* ---- esqueleto: cabecera, contenido desplazable y barra fija abajo (sin position:fixed) ---- */
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 18px 8px}
.top h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0}
.top small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.sync{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:0;border-radius:999px;padding:7px 12px;font-size:12.5px;color:var(--muted);cursor:pointer;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync b{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.sync.ok b{background:var(--pos)}
main{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:6px 14px 24px}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tb{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:10.5px;min-width:0;font-weight:600;cursor:pointer}
.tb[aria-selected="true"]{color:var(--accent)}
.tb.add span{width:44px;height:44px;margin-top:-4px;border-radius:50%;background:linear-gradient(135deg,#5B8CFF,#8B6CFF);box-shadow:0 6px 18px rgba(91,140,255,.35);color:#fff;display:grid;place-items:center}
.tb.add{color:var(--ink)}

/* ---- tarjetas y filas ---- */
.card{background:var(--surface);border:1px solid var(--edge);border-radius:var(--r);padding:16px;margin:0 0 12px}
.card-h{font-size:15px;font-weight:700;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.card-h small{color:var(--muted);font-weight:500}
.card.list{padding:6px 8px}
.row{display:flex;align-items:center;gap:12px;padding:11px 8px;border-radius:14px;width:100%;background:none;border:0;text-align:left}
.row+.row{border-top:1px solid var(--line);border-radius:0}
.row.tap,.opt{cursor:pointer}
.row.tap:active,.opt:active{background:var(--surface-2)}
.row-m{flex:1;min-width:0;display:flex;flex-direction:column}
.row-m b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .row.tap .row-m b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25}
.row-m b.wrap{white-space:normal}
.row-m small,.row-r small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-m em{font-style:normal;color:var(--warn);font-weight:600}
.row-r{display:flex;flex-direction:column;align-items:flex-end;text-align:right;font-weight:600;flex:none}
.row-r small{font-weight:500}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;letter-spacing:.02em}
.av.big{width:52px;height:52px;font-size:18px}
.av.ic{background:var(--accent-soft)!important;color:var(--accent)}
.chev{color:var(--muted)} .chev svg{width:18px;height:18px}
.empty{padding:18px;text-align:center;color:var(--muted)}
.card.empty p{margin:8px 0 14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tiles.three{grid-template-columns:repeat(3,1fr)}
.tile{background:var(--surface-2);border-radius:16px;padding:12px;min-width:0}
.tile span{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
.tile b{display:block;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiles.three .tile b{font-size:15px}
[data-xi]{cursor:pointer;-webkit-user-select:none;user-select:none}
.tile[data-xi]:active,.row[data-xi]:active{transform:scale(.98);transition:transform .08s}
.tapnote{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:12.5px;margin:0 0 12px}
.tapnote svg{width:15px;height:15px}
.ib svg{width:16px;height:16px;color:var(--muted)}

/* ---- portada ---- */
.hero{background:var(--hero);border:1px solid rgba(120,140,255,.18);color:#fff;border-radius:26px;padding:22px 20px 18px;margin:0 0 14px;text-align:center}
.hero-l{font-size:13px;opacity:.85;font-weight:500}
.hero-n{font-size:clamp(40px,12vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:6px 0 12px}
.hero-n span{font-size:.5em;opacity:.8;font-weight:700}
.hero-pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600}
.hero-bar{display:flex;height:8px;border-radius:999px;overflow:hidden;margin-top:18px;background:rgba(255,255,255,.2);gap:2px}
.hero-bar i{display:block;height:100%}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 14px}
.act{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink)}
.act span{width:52px;height:52px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--accent)}
.act:active span{background:var(--accent-soft)}
.actions.pact{grid-template-columns:repeat(5,1fr);margin:6px 0 16px}
.actions.pact .act span{width:48px;height:48px;background:var(--surface)}
.btns .btn.ghost{background:var(--surface-2)}

/* ---- activos ---- */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -14px 12px;padding:0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--surface-2);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:#BFD0FF;box-shadow:inset 0 0 0 1px rgba(91,140,255,.4)}

/* ---- histórico ---- */
.chartbox{position:relative;height:230px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.dash{height:0;border-top:2px dashed var(--ink);border-radius:0;width:14px}

/* ---- formularios ---- */
.h2{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:6px 4px 10px}
.backbtn{border:0;background:none;display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:600;padding:4px 0;cursor:pointer}
.backbtn svg{width:20px;height:20px}
form{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.fl{min-width:0}
.fl{display:grid;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea{max-width:100%;border:0;background:var(--surface-2);border-radius:14px;padding:13px 14px;color:var(--ink);min-width:0;width:100%;font-size:16px}
textarea{resize:vertical}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:14px;padding:4px}
.seg2 input{position:absolute;opacity:0;pointer-events:none}
.seg2 span{display:block;text-align:center;padding:10px;border-radius:11px;font-weight:600;cursor:pointer}
.seg2 input:checked+span{background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(91,140,255,.35)}
.check{display:flex;gap:10px;align-items:center;font-size:14px}
.check input{width:20px;height:20px}
.vlist{display:grid}
.vrow{min-width:0;display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.vrow input{width:120px;flex:none;text-align:right}
.btn{appearance:none;border:0;background:linear-gradient(135deg,#5B8CFF,#7C6CFF);color:#fff;padding:14px 18px;border-radius:999px;font-weight:700;cursor:pointer;font-size:15px}
.btn:disabled{opacity:.45}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:none;color:var(--neg)}
.btn.wide{width:100%;display:block;text-align:center}
.btns{display:flex;gap:8px;margin-top:10px}.btns .btn{flex:1}
.hint{color:var(--muted);font-size:13px;margin:4px 0}
details.edit summary{font-weight:700;cursor:pointer;list-style:none}
details.edit summary::-webkit-details-marker{display:none}
details.edit summary::after{content:"＋";float:right;color:var(--muted)}
details.edit[open] summary::after{content:"－"}
details.edit form{margin-top:12px}

/* ---- deudas ---- */
.loan-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.prog{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin:0 0 12px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:999px}
.del{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:4px 6px;cursor:pointer;flex:none}


/* ---- bancos desplegables ---- */
.acc+.acc{border-top:1px solid var(--line)}
.acc .row+.row{border-top:0}
.acc-c{transition:transform .2s}
.acc.open .acc-c{transform:rotate(90deg)}
.acc-b{display:none;padding:0 4px 8px 12px}
.acc.open .acc-b{display:block}
.sub{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px dashed var(--line)}
.sub .row-m b{font-size:14px;white-space:normal;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tapname{cursor:pointer}
.sub-c{flex:none;display:flex;flex-direction:column;align-items:flex-end;min-width:72px;background:var(--surface-2);border-radius:12px;padding:6px 9px}
.sub-c small{color:var(--muted);font-size:11px}
.sub-c b{font-size:13.5px;font-weight:700}
/* ---- gráficos circulares y barras ---- */
.chips.in{margin:0 0 12px;padding:0}
.donut{display:grid;grid-template-columns:140px minmax(0,1fr);gap:14px;align-items:center}
.dn-c{position:relative;height:140px}
.dn-l{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;min-width:0}
.dn-r{min-width:0}
.dn-r{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:5px 6px;border-radius:10px}
.dn-r:active{background:var(--surface-2)}
.dn-r i{width:10px;height:10px;border-radius:3px;flex:none}
.dn-r span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dn-r b{font-weight:700}
.hbar{display:grid;grid-template-columns:minmax(0,38%) 1fr 58px;gap:10px;align-items:center;padding:7px 4px;border-radius:10px;font-size:13.5px}
.hbar:active{background:var(--surface-2)}
.hb-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-t{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;position:relative}
.hb-t i{display:block;height:100%;border-radius:999px}
.hb-t.ctr i{position:absolute;top:0}
.hb-t.ctr::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.hb-v{text-align:right;font-weight:700}
.sublab{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin:14px 4px 4px}
.riskscale{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:120px;align-items:end;margin:4px 0 8px}
.rs{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.rs i{width:100%;border-radius:8px 8px 4px 4px;background:var(--surface-2)}
.rs.on i{background:linear-gradient(180deg,#B53FD8,#2B4CFF)}
.rs span{font-size:12px;font-weight:700;color:var(--muted)}
@media (max-width:360px){.donut{grid-template-columns:1fr}}
/* ---- hojas (explicaciones y ficha) ---- */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);max-width:640px;width:100%}
dialog::backdrop{background:rgba(0,0,0,.65);backdrop-filter:blur(3px)}
#sheet{margin:auto auto 0;border-radius:26px 26px 0 0;max-height:85vh;overflow:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet[open]{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 0}
.sh-b{padding:14px 22px 22px}
.sh-t{font-size:15px;color:var(--muted);font-weight:600}
.sh-v{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:2px 0 6px}
.sh-k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-top:14px}
.sh-b p{margin:6px 0 0;font-size:16px;line-height:1.5}
.sh-tip,.note{display:flex;gap:10px;background:var(--accent-soft);border-radius:16px;padding:12px 14px;margin:16px 0 4px;font-size:14px;line-height:1.45}
.sh-tip svg,.note svg{flex:none;color:var(--accent);width:20px;height:20px}
.sh-b .btn{margin-top:18px}
#dlg{height:100%;max-height:100%;margin:0 auto;background:var(--bg);overflow:auto;padding:0 14px calc(24px + env(safe-area-inset-bottom,0px))}
#dlg[open]{animation:up .22s ease-out}
.pd-top{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 0 8px;background:var(--bg)}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;cursor:pointer}
.pd-h{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.pd-n{font-size:19px;font-weight:800;letter-spacing:-.01em}
.pd-s{color:var(--muted);font-size:13px}
.pd-v{font-size:40px;font-weight:800;letter-spacing:-.03em}
.pd-g{font-size:15px;font-weight:600;color:var(--muted);margin:2px 0 12px}
.pchart{height:130px;margin:0 0 14px}

/* ---- entrada ---- */
#gate{height:100vh;height:100dvh;overflow:auto;display:grid;place-items:center;padding:24px;background:var(--hero);color:#fff}
.gatebox{max-width:380px;width:100%;text-align:center}
.gatebox h1{font-size:40px;font-weight:800;letter-spacing:-.03em;margin:0 0 8px}
.gatebox p{opacity:.9}
.gatebox .btn{background:#EEF1F6;color:#0A0C11;width:100%;margin-top:18px}
.gatebox details{margin-top:18px;text-align:left;font-size:13px}
.gatebox pre{white-space:pre-wrap;font-size:12px;background:rgba(0,0,0,.25);border-radius:12px;padding:10px;margin-top:8px}
#gatemsg{font-weight:600;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.on{opacity:1}
@media (min-width:700px){ .app{border-left:1px solid var(--line);border-right:1px solid var(--line)} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- v3: componentes nuevos ---- */
.big{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:2px 0 12px}
.tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{border:1px solid var(--edge)}
.linkbtn{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:12px;padding:12px 2px 2px;border:0;border-top:1px solid var(--line);background:none;color:var(--accent);font:inherit;font-weight:600;cursor:pointer}
.linkbtn svg{width:16px;height:16px}
.claim{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;font-size:14px;line-height:1.4}
.claim:first-of-type{border-top:0}
.claim svg{width:18px;height:18px;flex:none;color:var(--warn);margin-top:1px}
details.kw{border-top:1px solid var(--line);margin-top:10px;padding-top:4px}
details.kw summary{list-style:none;cursor:pointer;padding:10px 0;font-weight:600;display:flex;justify-content:space-between;align-items:center}
details.kw summary::-webkit-details-marker{display:none}
details.kw summary small{background:var(--surface-2);color:var(--muted);border-radius:999px;padding:2px 9px;font-size:12px}
details.kw p{margin:0 0 8px;padding:10px 12px;background:var(--surface-2);border-radius:12px;font-size:13.5px;line-height:1.45;cursor:pointer}
details.kw .hbar{grid-template-columns:minmax(0,1fr) auto auto;gap:10px}
.chartbox.sm{height:170px;position:relative}
.btn.sm{padding:8px 14px;font-size:13px}
.btn.wide{width:100%}
.check{display:flex;gap:10px;align-items:center;font-size:14px;margin:10px 0}
.check input{width:18px;height:18px;accent-color:var(--accent)}
input,select,textarea{background:var(--surface-2)!important;color:var(--ink)!important;border-color:var(--line)!important}

/* ---- v4 ---- */
.tb{font-size:10px;letter-spacing:-.01em}
.tb svg{width:22px;height:22px}
.tb.add span{width:42px;height:42px}
.pill.ok{background:rgba(47,208,143,.14);color:var(--pos);border:0;font-size:12px;padding:5px 10px;border-radius:999px;margin-left:auto}
.btn.danger.sm{background:none;color:var(--neg);box-shadow:inset 0 0 0 1px rgba(255,107,107,.35)}
.row-r small{display:block;text-align:right}
.row-m small.w{white-space:normal;overflow:visible}
.bar2{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;display:flex}
.bar2 i{display:block;height:100%}
.pd .fx{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:6px 0 14px}
.tile small{display:block;color:var(--muted);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tophd{display:flex;align-items:center;gap:6px}
#masbtn{color:var(--muted)}
details.kw summary>span.num{font-weight:700}
details.kw .hbar.yb,.hbar.yb{grid-template-columns:44px minmax(0,1fr) 96px}
.sbar{display:flex;height:14px;border-radius:999px;overflow:hidden;gap:2px;margin:4px 0 12px}
