<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://graph.microsoft.com https://login.microsoftonline.com https://login.live.com https://*.1drv.com https://*.files.1drv.com https://*.microsoftpersonalcontent.com https://*.livefilestore.com https://onedrive.live.com https://*.sharepoint.com; frame-src https://login.microsoftonline.com https://login.live.com; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Mi patrimonio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --surface-2:#EEF0F4; --ink:#191C1F; --muted:#6F7682; --line:#E6E8EC;
  --accent:#0666EB; --accent-soft:#E6F0FE; --pos:#00A36C; --neg:#E23B3B; --warn:#F5A524;
  --inv:#0666EB; --ei:#8B5CF6; --ef:#A3ABB8;
  --inv-on:#FFFFFF; --ei-on:#C9B8FF; --ef-on:rgba(255,255,255,.45);
  --hero:linear-gradient(150deg,#2B4CFF 0%,#6A3DF5 55%,#B53FD8 100%);
  --r:22px; --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000000; --surface:#15161A; --surface-2:#22242A; --ink:#F4F5F7; --muted:#8C93A0; --line:#262931;
  --accent:#3D8BFF; --accent-soft:#132544; --pos:#2BD18D; --neg:#FF5C5C;
  --inv:#3D8BFF; --ei:#A383FF; --ef:#6B7280; color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)}
[hidden]{display:none!important}

/* ---- esqueleto: cabecera, contenido desplazable y barra fija abajo (sin position:fixed) ---- */
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 18px 8px}
.top h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0}
.top small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.sync{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:0;border-radius:999px;padding:7px 12px;font-size:12.5px;color:var(--muted);cursor:pointer;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync b{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.sync.ok b{background:var(--pos)}
main{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:6px 14px 24px}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tb{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer}
.tb[aria-selected="true"]{color:var(--accent)}
.tb.add span{width:44px;height:44px;margin-top:-4px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center}
.tb.add{color:var(--ink)}

/* ---- tarjetas y filas ---- */
.card{background:var(--surface);border-radius:var(--r);padding:16px;margin:0 0 12px}
.card-h{font-size:15px;font-weight:700;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.card-h small{color:var(--muted);font-weight:500}
.card.list{padding:6px 8px}
.row{display:flex;align-items:center;gap:12px;padding:11px 8px;border-radius:14px;width:100%;background:none;border:0;text-align:left}
.row+.row{border-top:1px solid var(--line);border-radius:0}
.row.tap,.opt{cursor:pointer}
.row.tap:active,.opt:active{background:var(--surface-2)}
.row-m{flex:1;min-width:0;display:flex;flex-direction:column}
.row-m b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .row.tap .row-m b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25}
.row-m b.wrap{white-space:normal}
.row-m small,.row-r small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-m em{font-style:normal;color:var(--warn);font-weight:600}
.row-r{display:flex;flex-direction:column;align-items:flex-end;text-align:right;font-weight:600;flex:none}
.row-r small{font-weight:500}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;letter-spacing:.02em}
.av.big{width:52px;height:52px;font-size:18px}
.av.ic{background:var(--accent-soft)!important;color:var(--accent)}
.chev{color:var(--muted)} .chev svg{width:18px;height:18px}
.empty{padding:18px;text-align:center;color:var(--muted)}
.card.empty p{margin:8px 0 14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tiles.three{grid-template-columns:repeat(3,1fr)}
.tile{background:var(--surface-2);border-radius:16px;padding:12px;min-width:0}
.tile span{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
.tile b{display:block;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiles.three .tile b{font-size:15px}
[data-xi]{cursor:pointer;-webkit-user-select:none;user-select:none}
.tile[data-xi]:active,.row[data-xi]:active{transform:scale(.98);transition:transform .08s}
.tapnote{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:12.5px;margin:0 0 12px}
.tapnote svg{width:15px;height:15px}
.ib svg{width:16px;height:16px;color:var(--muted)}

/* ---- portada ---- */
.hero{background:var(--hero);color:#fff;border-radius:28px;padding:22px 20px 18px;margin:0 0 14px;text-align:center}
.hero-l{font-size:13px;opacity:.85;font-weight:500}
.hero-n{font-size:clamp(40px,12vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:6px 0 12px}
.hero-n span{font-size:.5em;opacity:.8;font-weight:700}
.hero-pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.18);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600}
.hero-bar{display:flex;height:8px;border-radius:999px;overflow:hidden;margin-top:18px;background:rgba(255,255,255,.2);gap:2px}
.hero-bar i{display:block;height:100%}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 14px}
.act{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink)}
.act span{width:52px;height:52px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--accent)}
.act:active span{background:var(--accent-soft)}

/* ---- activos ---- */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -14px 12px;padding:0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--surface);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* ---- histórico ---- */
.chartbox{position:relative;height:230px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.dash{height:0;border-top:2px dashed var(--ink);border-radius:0;width:14px}

/* ---- formularios ---- */
.h2{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:6px 4px 10px}
.backbtn{border:0;background:none;display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:600;padding:4px 0;cursor:pointer}
.backbtn svg{width:20px;height:20px}
form{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.fl{min-width:0}
.fl{display:grid;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea{max-width:100%;border:0;background:var(--surface-2);border-radius:14px;padding:13px 14px;color:var(--ink);min-width:0;width:100%;font-size:16px}
textarea{resize:vertical}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:14px;padding:4px}
.seg2 input{position:absolute;opacity:0;pointer-events:none}
.seg2 span{display:block;text-align:center;padding:10px;border-radius:11px;font-weight:600;cursor:pointer}
.seg2 input:checked+span{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.check{display:flex;gap:10px;align-items:center;font-size:14px}
.check input{width:20px;height:20px}
.vlist{display:grid}
.vrow{min-width:0;display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.vrow input{width:120px;flex:none;text-align:right}
.btn{appearance:none;border:0;background:var(--accent);color:#fff;padding:14px 18px;border-radius:999px;font-weight:700;cursor:pointer;font-size:15px}
.btn:disabled{opacity:.45}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:none;color:var(--neg)}
.btn.wide{width:100%;display:block;text-align:center}
.btns{display:flex;gap:8px;margin-top:10px}.btns .btn{flex:1}
.hint{color:var(--muted);font-size:13px;margin:4px 0}
details.edit summary{font-weight:700;cursor:pointer;list-style:none}
details.edit summary::-webkit-details-marker{display:none}
details.edit summary::after{content:"＋";float:right;color:var(--muted)}
details.edit[open] summary::after{content:"－"}
details.edit form{margin-top:12px}

/* ---- deudas ---- */
.loan-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.prog{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin:0 0 12px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:999px}
.del{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:4px 6px;cursor:pointer;flex:none}

/* ---- hojas (explicaciones y ficha) ---- */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);max-width:640px;width:100%}
dialog::backdrop{background:rgba(0,0,0,.45)}
#sheet{margin:auto auto 0;border-radius:26px 26px 0 0;max-height:85vh;overflow:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet[open]{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 0}
.sh-b{padding:14px 22px 22px}
.sh-t{font-size:15px;color:var(--muted);font-weight:600}
.sh-v{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:2px 0 6px}
.sh-k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-top:14px}
.sh-b p{margin:6px 0 0;font-size:16px;line-height:1.5}
.sh-tip,.note{display:flex;gap:10px;background:var(--accent-soft);border-radius:16px;padding:12px 14px;margin:16px 0 4px;font-size:14px;line-height:1.45}
.sh-tip svg,.note svg{flex:none;color:var(--accent);width:20px;height:20px}
.sh-b .btn{margin-top:18px}
#dlg{height:100%;max-height:100%;margin:0 auto;background:var(--bg);overflow:auto;padding:0 14px calc(24px + env(safe-area-inset-bottom,0px))}
#dlg[open]{animation:up .22s ease-out}
.pd-top{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 0 8px;background:var(--bg)}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;cursor:pointer}
.pd-h{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.pd-n{font-size:19px;font-weight:800;letter-spacing:-.01em}
.pd-s{color:var(--muted);font-size:13px}
.pd-v{font-size:40px;font-weight:800;letter-spacing:-.03em}
.pd-g{font-size:15px;font-weight:600;color:var(--muted);margin:2px 0 12px}
.pchart{height:130px;margin:0 0 14px}

/* ---- entrada ---- */
#gate{height:100vh;height:100dvh;overflow:auto;display:grid;place-items:center;padding:24px;background:var(--hero);color:#fff}
.gatebox{max-width:380px;width:100%;text-align:center}
.gatebox h1{font-size:40px;font-weight:800;letter-spacing:-.03em;margin:0 0 8px}
.gatebox p{opacity:.9}
.gatebox .btn{background:#fff;color:#191C1F;width:100%;margin-top:18px}
.gatebox details{margin-top:18px;text-align:left;font-size:13px}
.gatebox pre{white-space:pre-wrap;font-size:12px;background:rgba(0,0,0,.25);border-radius:12px;padding:10px;margin-top:8px}
#gatemsg{font-weight:600;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.on{opacity:1}
@media (min-width:700px){ .app{border-left:1px solid var(--line);border-right:1px solid var(--line)} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="gate" hidden><div class="gatebox"><h1>Mi patrimonio</h1><p>Entra con tu cuenta Microsoft. Lo aprobarás en Microsoft Authenticator.</p><button class="btn" id="loginbtn">Entrar con Microsoft</button><p id="gatemsg"></p><details><summary>Detalles técnicos (para enviar a Claude)</summary><pre id="gatelog"></pre><button class="btn" id="clearlog">Borrar detalles</button></details></div></div>
<div class="app" hidden>
  <header class="top"><div><h1 id="ttl">Inicio</h1><small id="asof">Cargando…</small></div><button class="sync" id="status" aria-label="Estado de sincronización"><b></b><span>Conectando…</span></button></header>
  <main>
    <section id="inicio"></section>
    <section id="activos" hidden></section>
    <section id="anadir" hidden></section>
    <section id="historico" hidden></section>
    <section id="mas" hidden></section>
  </main>
  <nav class="tabbar" aria-label="Secciones">
    <button class="tb" data-tab="inicio" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
    <button class="tb" data-tab="activos"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l7 4.5"/></svg>Activos</button>
    <button class="tb add" data-tab="anadir" aria-label="Añadir"><span><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span></button>
    <button class="tb" data-tab="historico"><svg viewBox="0 0 24 24"><path d="M4 19h16M6 15l4-5 4 3 5-7"/></svg>Histórico</button>
    <button class="tb" data-tab="mas"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>Más</button>
  </nav>
</div>
<dialog id="dlg" aria-label="Detalle del producto"></dialog>
<dialog id="sheet" aria-label="Explicación"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script src="lib/msal-browser.min.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<script src="lib/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
