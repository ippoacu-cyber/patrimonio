<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://graph.microsoft.com https://login.microsoftonline.com https://login.live.com; frame-src https://login.microsoftonline.com https://login.live.com; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Mi patrimonio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#15233A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#15233A; --muted:#5B6B80; --line:#D6DDE5;
  --inv:#1E6E74; --ei:#B8922E; --ef:#8C96A8; --debt:#A8473C; --pos:#2F7D4F; --neg:#B0413E; --focus:#2C5BD6;
  --radius-l:14px; --radius-s:8px;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1621;--surface:#16212E;--surface-2:#1B2836;--ink:#E6ECF2;--muted:#93A3B5;--line:#263546;--inv:#3FA3A9;--ei:#D4AE4C;--ef:#7D889B;--debt:#D06A5D;--pos:#4FB07A;--neg:#E07067;--focus:#7FA2FF}}
:root[data-theme="dark"]{--bg:#0E1621;--surface:#16212E;--surface-2:#1B2836;--ink:#E6ECF2;--muted:#93A3B5;--line:#263546;--inv:#3FA3A9;--ei:#D4AE4C;--ef:#7D889B;--debt:#D06A5D;--pos:#4FB07A;--neg:#E07067;--focus:#7FA2FF}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav.side{padding:28px 18px;border-right:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font-family:var(--serif);font-size:28px;line-height:1;margin:0 8px 28px}
.brand small{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:8px}
.tab{appearance:none;border:0;background:none;text-align:left;padding:10px 12px;border-radius:var(--radius-s);cursor:pointer;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 3px 0 0 var(--inv)}
.tab:hover{color:var(--ink)}
.status{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px}
.status b{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ef);margin-right:6px}
.status.ok b{background:var(--pos)}
main{padding:32px clamp(16px,4vw,48px) 96px;max-width:1240px;width:100%;min-width:0}
body{overflow-x:hidden}
.panel,.grid>*{min-width:0}
section[hidden]{display:none}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,4vw,40px);margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:15px;font-weight:600;margin:0 0 14px}
.lede{color:var(--muted);margin:0 0 26px;max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);padding:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1.4fr 1fr}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--muted)}
/* hero */
.hero{padding:28px 28px 24px;margin-bottom:16px}
.hero-top{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-end;justify-content:space-between}
.hero-label{color:var(--muted);font-size:14px}
.hero-num{font-family:var(--serif);font-size:clamp(48px,8vw,84px);line-height:.95;letter-spacing:-.02em;margin-top:6px}
.hero-num .cents{font-size:.45em;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(150px,1fr));gap:14px 32px}
.kpi span{display:block;color:var(--muted);font-size:13px}
.kpi strong{font-size:20px;font-weight:600}
.compo{margin-top:26px}
.bar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.bar i{display:block;height:100%}
.debtbar{display:flex;justify-content:flex-end;margin-top:6px;height:8px}
.debtbar i{display:block;height:100%;background:var(--debt);border-radius:0 0 4px 4px;opacity:.85}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:12px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
/* lists */
.hbars{display:grid;gap:10px}
.hb{display:grid;grid-template-columns:120px 1fr 90px;gap:10px;align-items:center;font-size:14px}
.hb .t{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.hb .t i{display:block;height:100%;background:var(--inv)}
.alerts{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:14px}
.alerts li{padding-left:14px;border-left:3px solid var(--ei)}
.alerts li.warn{border-left-color:var(--debt)}
/* table */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:11px 14px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-weight:500;color:var(--muted);font-size:12.5px;background:var(--surface-2);position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tr.total td{font-weight:600;cursor:default;background:var(--surface-2)}
.pname{font-weight:600}
.psub{display:block;color:var(--muted);font-size:12.5px;font-weight:400}
.cat{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:8px;vertical-align:1px}
.est{display:inline-block;margin-left:6px;font-size:11px;padding:1px 6px;border-radius:4px;background:color-mix(in srgb,var(--ei) 22%,transparent);color:var(--ink);font-weight:500}
.stale{color:var(--debt)}
/* forms */
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.seg button{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:var(--radius-s);cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
form{display:grid;gap:14px;max-width:720px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
label{display:grid;gap:5px;font-size:13px;color:var(--muted)}
input,select{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-s);padding:9px 11px;color:var(--ink);min-width:0}
input[type=number]{font-variant-numeric:tabular-nums}
.btn{appearance:none;border:0;background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:var(--radius-s);font-weight:600;cursor:pointer;justify-self:start}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--neg);border:1px solid var(--line);padding:5px 10px;font-weight:500;font-size:12.5px}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.radio{display:flex;gap:16px;flex-wrap:wrap;color:var(--ink);font-size:14px}
.radio label{display:flex;align-items:center;gap:6px;color:var(--ink)}
.vtable input{width:130px;text-align:right}
/* loans */
.loans{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.prog{height:10px;border-radius:5px;background:color-mix(in srgb,var(--debt) 18%,transparent);overflow:hidden;margin:14px 0 10px}
.prog i{display:block;height:100%;background:var(--debt)}
.dl{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;margin:0}
.dl dt{color:var(--muted)} .dl dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.bigdebt{font-family:var(--serif);font-size:40px;line-height:1}
/* drawer */
dialog{border:1px solid var(--line);border-radius:var(--radius-l);background:var(--surface);color:var(--ink);padding:0;width:min(860px,94vw);max-height:88vh}
dialog::backdrop{background:rgba(10,18,28,.45)}
.dlg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:20px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.dlg-b{padding:18px 22px;overflow:auto}
.x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.chartbox{position:relative;height:340px}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  nav.side{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;border-right:0;border-top:1px solid var(--line);background:var(--surface);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10;overflow-x:auto;gap:2px}
  .brand,.status{display:none}
  .tab{flex:1;text-align:center;font-size:12.5px;padding:10px 6px;white-space:nowrap}
  .tab[aria-selected="true"]{box-shadow:inset 0 -2px 0 var(--inv)}
  .g2{grid-template-columns:1fr}
  main{padding-top:22px}
  .hb{grid-template-columns:90px 1fr 80px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

#gate{min-height:100vh;display:grid;place-items:center;padding:24px}
#gate[hidden]{display:none} .app[hidden]{display:none}
.gatebox{max-width:420px;text-align:center}
.gatebox h1{font-size:44px;margin-bottom:10px}
.who{font-size:12px;color:var(--muted);padding:0 8px;margin-top:6px;word-break:break-all}
</style>
</head>
<body>
<div id="gate" hidden><div class="gatebox"><h1>Mi patrimonio</h1><p class="lede" style="margin:0 auto 22px">Entra con tu cuenta Microsoft. La aprobarás en Microsoft Authenticator.</p><button class="btn" id="loginbtn" style="justify-self:center">Entrar con Microsoft</button><p class="hint" id="gatemsg" style="margin-top:14px"></p></div></div>
<div class="app" hidden>
  <nav class="side" aria-label="Secciones">
    <div class="brand">Mi patrimonio<small id="asof">Cargando…</small></div>
    <button class="tab" data-tab="resumen" aria-selected="true">Resumen</button>
    <button class="tab" data-tab="posiciones">Posiciones</button>
    <button class="tab" data-tab="historico">Histórico</button>
    <button class="tab" data-tab="deudas">Deudas</button>
    <button class="tab" data-tab="actualizar">Actualizar</button>
    <button class="tab" data-tab="datos">Datos</button>
    <div class="status" id="status"><b></b><span>Conectando…</span></div>
    <div class="who" id="who"></div>
  </nav>
  <main>
    <p class="hint" id="mstatus" style="margin:0 0 10px"></p>
    <section id="resumen"></section>
    <section id="posiciones" hidden></section>
    <section id="historico" hidden></section>
    <section id="deudas" hidden></section>
    <section id="actualizar" hidden></section>
    <section id="datos" hidden></section>
  </main>
</div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script src="lib/msal-browser.min.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<script src="lib/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
